[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "close-gripper"
version = "0.1.0"
description = "Evidence-gated bilateral gripper target generation and review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=15", "opencv-python-headless>=4.8", "numpy>=1.24"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
close-gripper = "close_gripper.cli:main"

[tool.setuptools.packages.find]
include = ["close_gripper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
