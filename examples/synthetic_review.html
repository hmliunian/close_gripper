</style><h1>双侧夹爪 · 开度指令与视觉证据审阅</h1>
<p>纵轴为归一化夹爪开度（0～1）：0 = 全闭，1 = 全开。灰线是原始实测开度；目标开度为0表示发出全闭指令，持物时实测开度仍可大于0。</p>
<p class="note">橙色为待复核候选；绿色仅为通过当前契约的目标。合成示例只验证数学行为。释放策略尚未批准，含释放事件不进入有效训练标签。真实模型判断不等于人工参考。</p>
